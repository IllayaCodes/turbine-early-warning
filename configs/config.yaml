data:
  raw_dir: data/raw
  skip_rows: 9
  years: [2016, 2017, 2018, 2019]

signals:
  wind_speed: "Wind speed"
  power: "Power"
  rotor_speed: "Rotor speed"
  gearbox_speed: "Gearbox speed"
  ambient_temp: "Nacelle ambient temperature"
  gear_oil_temp: "Gear oil temperature"
  gen_bearing_front_temp: "Generator bearing front temperature"
  gen_bearing_rear_temp: "Generator bearing rear temperature"

cleaning:
  min_wind_speed: 3.0
  max_wind_speed: 25.0
  min_power: 0.0
  min_rotor_speed: 5.0
  min_stop_rows: 12
  warmup_rows: 36
  limits:
    rotor_speed: [0, 20]
    power: [-50, 2200]
    ambient_temp: [-30, 45]
    gear_oil_temp: [0, 90]
    gen_bearing_front_temp: [0, 90]
    gen_bearing_rear_temp: [0, 90]

split:
  train: ["2016-05-01", "2017-07-31"]
  validation: ["2017-08-01", "2017-10-31"]
  test: ["2017-11-01", "2019-12-31"]

model:
  features: [wind_speed, power, rotor_speed, gearbox_speed, ambient_temp]
  targets: [gear_oil_temp, gen_bearing_front_temp, gen_bearing_rear_temp]

event:
  years: [2019, 2020, 2021]
  turbine: 6
  fault_start: "2021-02-05 08:46:16"
  split:
    train: ["2019-07-01", "2020-06-30"]
    validation: ["2020-07-01", "2020-10-31"]
    test: ["2020-11-01", "2021-07-01"]

alerts:
  min_rows_per_day: 36
  min_other_turbines: 3
  k: 4.0
  floor_c: 2.0
  min_validation_days: 30
  consecutive_days: 3
  window_days: 30